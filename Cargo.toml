[package]
name = "task_sdk"
version = "0.1.0"
edition = "2024"

[lib]
# This tells Rust to create a dynamic library file (.wasm) 
# while still allowing it to be used as a regular Rust library (.rlib)
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"