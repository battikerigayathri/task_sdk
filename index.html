<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Rust SDK Frontend Test</title>
  </head>
  <body>
    <h1>Check the Console (F12)</h1>
    <p>The Rust SDK is running behind the scenes!</p>

    <script type="module">
      // This link points directly to the file you just pushed!
      import init, {
        TaskManager,
      } from "https://cdn.jsdelivr.net/gh/battikerigayathri/task_sdk@main/pkg/task_sdk.js";

      async function run() {
        // Initialize the Rust WASM engine
        await init();

        // Create the SDK manager
        const sdk = new TaskManager();

        // Add a task using your Rust logic
        sdk.add_task("Successfully linked to GitHub SDK!");

        console.log("Tasks from GitHub:", sdk.get_tasks_json());
      }

      run();
    </script>
  </body>
</html>
